# P36 实例（20 GiB L2）的 p37 配置模板。
#
# 首次启动时由 p37-run 复制到 /srv/repos/.p37/config.toml，作为多 repo 默认。
#
# 注意：这里不要写 auth_token、S3 密钥或任何凭据。HTTP 模式默认关闭；
# 如确实要开，token 应由实例侧注入，而不是随 L1/发布物分发。

[repo]
format_ver = 2

[workspace]
# Ubuntu 26.04 非 root 下 OverlayFS 可能 EPERM（即使有 CAP_SYS_ADMIN）。
# auto 会先尝试 overlay，失败后回退 copy；真实工作区模式写入 workspace.materialize。
materialize = "auto"
# 4 GiB 基底缓存；只有 overlay 模式使用，copy 模式不使用。
base_cache_bytes = 4294967296
# copy 模式每个工作区都是完整树；P34「主管 + N 子会话」至少需要 1+N 个。
# 4 正好等于「主管 + 3 子会话」，没有任何缓冲（主管每轮 drop 再重开时尤其
# 容易撞配额），因此默认 8；20 GiB L2 上请按仓库树大小与 repo_disk_usage
# 复核，必要时收紧。硬上限仍是 64。
max_active = 8
# 隐藏 merge/preview 工作区上限（不占 max_active）。
max_hidden = 32
# copy 模式磁盘占用更高；剩余空间低于 8 GiB 就告警。
warn_disk_bytes = 8589934592
scan_interval = "30s"
debounce = "500ms"

[daemon]
# socket 默认 <root>/.p37/p37d.sock；P36 的 root 是 /srv/repos。
# 要改路径时再显式写 socket = "..."
# HTTP 默认关闭：MCP 客户端与 daemon 同实例，优先 unix socket。
listen_http = false
log_level = "info"

[retention]
keep_versions = 200
keep_epochs = 20
epoch_size = 50

[gc]
scrub_sample = 0.01
verify_on_read = "sample"
