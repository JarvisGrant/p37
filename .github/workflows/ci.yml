name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1
      - name: cross-build
        run: make cross
