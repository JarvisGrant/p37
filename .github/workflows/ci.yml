name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
      - name: vet
        run: go vet ./...
      - name: test
        run: |
          # GitHub runner 的 /tmp 可能是粗粒度 mtime 的文件系统；p37 的
          # stat 快路径按 mtime_ns 判定，测试需要纳秒级时间戳。
          export TMPDIR="${RUNNER_TEMP}/p37-test-tmp"
          mkdir -p "$TMPDIR"
          echo "TMPDIR=$TMPDIR fs=$(stat -f -c %T "$TMPDIR")"
          # runner 的 mtime 粒度可能粗于纳秒；关闭 stat 快路径，保证测试
          # 验证的是语义而不是宿主文件系统的时间戳精度。
          export P37_FORCE_HASH=1
          go test ./... -count=1
      - name: cross-build
        run: make cross
